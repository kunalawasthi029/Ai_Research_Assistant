name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GROQ_API_KEY: mock_ci_key
      TAVILY_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Create isolated CI environment
        shell: python
        run: |
          import os
          import pathlib
          import venv
          environment = pathlib.Path(os.environ["RUNNER_TEMP"]) / "research-ci-venv"
          venv.EnvBuilder(with_pip=True).create(environment)
          binaries = environment / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(str(binaries) + "\n")
      - name: Install pinned build tools and hashed dependencies
        run: |
          python -m pip install setuptools==84.2.1 wheel==0.48.0
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint and formatting
        run: |
          python -m ruff check src tests frontend evals scripts
          python -m ruff format --check src tests frontend evals scripts
      - name: Type checking
        run: python -m mypy --no-incremental --python-version ${{ matrix.python }} src/research_agent frontend evals
      - name: Offline tests and coverage
        run: python -m pytest -m "not live" --cov=research_agent --cov=frontend --cov=evals --cov-fail-under=80 --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn

