name: Manual live evaluation

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of frozen queries (1 to 20)
        required: true
        default: '1'
      repetitions:
        description: Repetitions per arm (1 to 3)
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install setuptools==84.2.1 wheel==0.48.0
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute live evaluation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EVAL_LIMIT: ${{ inputs.limit }}
          EVAL_REPETITIONS: ${{ inputs.repetitions }}
        run: python -m evals.runner --limit "$EVAL_LIMIT" --repetitions "$EVAL_REPETITIONS" --throttle 60 --timeout 1800 --output evals/results/manual-ci.json
      - name: Upload observations including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-evaluation-${{ github.run_id }}
          path: evals/results/manual-ci*.json
          if-no-files-found: warn
